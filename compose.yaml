services:
  backend:
    build:
      context: ./backend
    ports:
      - "3001:3000"
    environment:
      PGHOST: database
      PGPORT: 5432
      PGUSER: seng513
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: seng513
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      TRIAL_DAYS: ${TRIAL_DAYS:-14}
      DEV_AUTH_LINKS: ${DEV_AUTH_LINKS:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
      PLAID_SANDBOX_SECRET: ${PLAID_SANDBOX_SECRET:-}
      PLAID_PRODUCTION_SECRET: ${PLAID_PRODUCTION_SECRET:-}
      PLAID_PRODUCTION_ENABLED: ${PLAID_PRODUCTION_ENABLED:-false}
      PLAID_TOKEN_ENCRYPTION_KEY: ${PLAID_TOKEN_ENCRYPTION_KEY:-}

      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ca-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_KEY: ${S3_KEY:-}

  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: seng513
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: seng513
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

services:
  backend:
    build:
      context: ./backend
    ports:
      - "3001:3000"
    environment:
      PGHOST: database
      PGPORT: 5432
      PGUSER: seng513
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: seng513

  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: seng513
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: seng513
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: